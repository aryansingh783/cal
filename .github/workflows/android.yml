name: Build Kivy APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Repo checkout
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Python setup (stable)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 3️⃣ System dependencies
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip \
          openjdk-17-jdk \
          build-essential \
          libffi-dev libssl-dev \
          libncurses5 \
          python3-pip

    # 4️⃣ Android SDK + tools
    - name: Install Android SDK
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk
        sudo chown -R $USER:$USER /usr/local/lib/android
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip tools.zip
        mv cmdline-tools latest

    # 5️⃣ Accept Android licenses (🔥 MAIN FIX)
    - name: Accept Android SDK licenses
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    # 6️⃣ Install Buildozer
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    # 7️⃣ Build APK
    - name: Build APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        buildozer android debug

    # 8️⃣ Upload APK as artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kivy-apk
        path: bin/*.apk
